# XDK 5233 library data layouts the runtime reads or writes. Each value comes from the Bloody Roar Extreme USA
# default.xbe (title 48550001) code at the address given.
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at
CDevice_Push          = 0x0     # D3DDevice_MakeSpace / KickOff read the push pointer
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture compares the push pointer with it
CDevice_Flags         = 0x8
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices 0x0EB5B0 stores BaseVertexIndex
CDevice_Time          = 0x2C
CDevice_ZScale        = 0x50C   # the viewport code 0x0EC6F6 scales the Z range by it
CDevice_SuperSampleX  = 0x518   # D3DDevice_Clear 0x0EAD3A scales X by it
CDevice_SuperSampleY  = 0x51C
CDevice_BackBufferScale = 0x528 # the render target setup 0x0EE05B reads the X scale, 0x0EE055 Y at +4
CDevice_PixelShader   = 0x36C
CDevice_VertexShader  = 0x37C
CDevice_IndexBuffer   = 0x388   # D3DDevice_SetIndices reads the old one and stores the new one
CDevice_Transforms    = 0x810   # D3DDevice_SetTransform 0x0EAEC0 copies 16 dwords to +0x810 + type * 64
CDevice_Viewport      = 0xA90
CDevice_ScreenSpaceOffset = 0xAA8
CDevice_Textures      = 0xB38   # D3DDevice_SetTexture 0x0EB370 stores [stage]
CDevice_Palettes      = 0xB48   # D3DDevice_SetPalette 0x0EB520 stores [stage]
CDevice_RenderTarget  = 0x15B4  # D3DDevice_GetRenderTarget2 0x0EB1D0 returns it
CDevice_Depth         = 0x15B8  # D3DDevice_GetDepthStencilSurface2 0x0EB1F0 returns it
CDevice_AutoDepth     = 0x15CC  # D3D_InitDefaultState 0x0F1850 sets ZEnable from it
CDevice_BackBuffer    = 0x15C0  # D3DDevice_GetBackBuffer2 0x0EB1B0 returns it for index 0
CDevice_FrontBuffer   = 0x15C4  # D3DDevice_GetBackBuffer2 0x0EB195 returns it for index -1
CDevice_VBlankCallback = 0x1958 # D3DDevice_SetVerticalBlankCallback 0x0EB02A stores it (miniport at +0x17C8, + 0x190)
CDevice_VBlankEvent   = 0x195C  # D3DDevice_BlockUntilVerticalBlank 0x0EB057 waits on it, 0x0EB04B clears its SignalState
CDevice_DisplayFlags  = 0x197C  # the mode code 0x0EEBCB tests it (miniport + 0x1B4)
CDevice_VBlankCount   = 0x1988  # 0x0EEC5B increments it (miniport + 0x1C0), D3DDevice_UpdateOverlay 0x0F01A8 reads it
CDevice_GammaRamps    = 0x19A4  # D3DDevice_GetGammaRamp 0x0EBAE3 copies from +0x19A4 + index * 0x300
CDevice_GammaPending  = 0x1FA4  # after the two ramps, as in 5849 (ramps + 0x600)
CDevice_SwapCount     = 0x2018  # D3DDevice_Swap increments it
CDevice_Size          = 0x2040  # Direct3D_CreateDevice clears 0x810 dwords of the device on failure
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture ors it into D3D__DirtyFlags
TextureState_Stage    = 32      # 0x0EB973 / 0x0EDB20: D3D__DeferredTextureState[stage * 32 + type]
Stream_Size           = 12      # D3DDevice_SetStreamSource indexes the stream table by n * 12
Stream_Stride         = 0x0
Stream_Buffer         = 0x8
PixelShader_Definition = 0x8
# DSOUND
CDirectSoundStream_Vtable  = 0x0  # CDirectSoundStream constructor 0x0FDF8A stores the first vtable
CDirectSoundStream_Vtable2 = 0x4  # CDirectSoundStream constructor 0x0FDF83 stores the second vtable
EffectsImage_Skip0    = 0x804   # 0x0FEC3B adds this dword count
EffectsImage_Skip1    = 0x80C   # 0x0FEC35 loads this dword count
EffectsImage_Desc     = 0x818   # 0x0FEC44: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record
XPP_Current           = 0x0     # XGetDevices 0x13A420 returns it
XPP_Changed           = 0x4     # XGetDevices 0x13A422 clears it
XPP_Previous          = 0x8     # XGetDevices 0x13A428 copies Current into it
