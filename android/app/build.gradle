plugins {
    id 'com.android.application'
}

// The native libraries come from the recompile (../build.sh); nothing game-derived is kept in git.
def nativeOut = "${rootDir}/../build/android-apk"

android {
    namespace 'com.yuriaaaaa.primalfury'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yuriaaaaa.primalfury'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '0.1.5'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('PRIMALFURY_KEYSTORE') ?: "${rootDir}/../build/primalfury.jks")
            storePassword System.getenv('PRIMALFURY_KEYSTORE_PASS') ?: 'android'
            keyAlias 'primalfury'
            keyPassword System.getenv('PRIMALFURY_KEYSTORE_PASS') ?: 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["${nativeOut}/jniLibs"]
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] }
    }

    lint { checkReleaseBuilds false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
